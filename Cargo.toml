[package]
name = "ds5-audio-haptics"
version = "0.2.0"
edition = "2021"
license = "MPL-2.0"
description = "Drive a Bluetooth DualSense's HD haptics from system audio"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = 2
lto = true
strip = true
panic = "abort"
